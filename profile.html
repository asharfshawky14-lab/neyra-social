
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090914">
  <title>حسابي | NEYRA</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080810;
      --line: #393052;
      --purple: #bba4ff;
      --cyan: #67e8f9;
      --muted: #aaa5c1;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      font-family: system-ui, Arial, sans-serif;
      color: #f7f5ff;
      background: radial-gradient(ellipse at top, #292052, #101020 55%, var(--bg));
    }

    .wrap {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 4px 0 18px;
    }

    .logo {
      font-size: 27px;
      font-weight: 900;
      letter-spacing: 4px;
      color: var(--purple);
    }

    .top a {
      color: var(--cyan);
      text-decoration: none;
    }

    .card {
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: #101020;
      box-shadow: 0 20px 70px #0008;
    }

    .hero {
      text-align: center;
      padding-bottom: 22px;
      border-bottom: 1px solid #ffffff12;
    }

    .avatar {
      width: 100px;
      height: 100px;
      margin: 0 auto 12px;
      border: 2px solid #a78bfa;
      border-radius: 50%;
      background: #211b38;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-size: 36px;
      color: var(--cyan);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h1 {
      margin: 8px 0;
      font-size: 25px;
    }

    .handle {
      color: var(--cyan);
      direction: ltr;
      unicode-bidi: plaintext;
    }

    .bio {
      color: #d6d1e7;
      line-height: 1.8;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .email {
      margin-top: 14px;
      color: var(--muted);
      font-size: 13px;
      direction: ltr;
      overflow-wrap: anywhere;
    }

    .field {
      margin: 18px 0;
      text-align: right;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      color: #e4dfff;
    }

    .read-value {
      min-height: 46px;
      padding: 12px 14px;
      border: 1px solid #ffffff16;
      border-radius: 12px;
      background: #090914;
      color: #f7f5ff;
      line-height: 1.8;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .section-title {
      text-align: right;
      margin: 24px 0 12px;
      font-size: 17px;
    }

    button, .button {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 13px;
      border: 0;
      border-radius: 12px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 750;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: wait;
    }

    .primary {
      color: #100c20;
      background: linear-gradient(100deg, #c4b5fd, #67e8f9);
    }

    .secondary {
      color: white;
      background: #242237;
      border: 1px solid #49425e;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 12px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .message.show { display: block; }

    .message.error {
      color: #ffb4c0;
      background: #ff365f12;
      border: 1px solid #ff365f40;
    }

    .message.success {
      color: #9cf5d4;
      background: #36d99a12;
      border: 1px solid #36d99a40;
    }

    @media (max-width: 460px) {
      .card { padding: 19px; }
      .top { padding: 0 3px; }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <header class="top">
      <div class="logo">NEYRA</div>
      <a href="index.html">← الرئيسية</a>
    </header>

    <section class="card">
      <div class="hero">
        <div class="avatar" id="avatarPreview">N</div>
        <h1 id="displayName">جارٍ تحميل الحساب...</h1>
        <div class="handle" id="usernamePreview">@...</div>
        <p class="bio" id="bioPreview">أهلاً بيك في مجتمع NEYRA</p>
        <div class="email" id="userEmail"></div>
      </div>

<div id="accountDetails" style="display: none;">
  <h2 class="section-title">معلومات الحساب</h2>

  <div class="field">
    <label>الاسم الظاهر</label>
    <div class="read-value" id="fullNameView">جارٍ التحميل...</div>
  </div>

  <div class="field">
    <label>اسم المستخدم</label>
    <div class="read-value handle" id="usernameView">@...</div>
  </div>

  <div class="field">
    <label>النبذة الشخصية</label>
    <div class="read-value bio" id="bioView">جارٍ تحميل النبذة...</div>
  </div>

  <div class="field">
    <label>تاريخ الانضمام</label>
    <div class="read-value" id="joinedView">—</div>
  </div>
</div>

<a class="button primary" href="settings.html">
  الإعدادات وتعديل الملف الشخصي
</a>

<a class="button secondary" href="index.html">
  العودة إلى الصفحة الرئيسية
</a>

      <button class="secondary" id="logoutBtn" type="button">
        تسجيل الخروج
      </button>

      <div class="message" id="message" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL =
      "https://aboenvwqlzmbjyqisarb.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_-U554BTwIf6tP-DA9uRgCg_5w5_XtU3";

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
    const $ = (id) => document.getElementById(id);

    const loginUrl = new URL("login.html", window.location.href).href;
    const homeUrl = new URL("index.html", window.location.href).href;

    function showMessage(text, type) {
      const message = $("message");
      message.textContent = text;
      message.className = "message show " + type;
    }

    function safeAvatarUrl(value) {
      if (!value) return "";

      try {
        const url = new URL(value);
        return url.protocol === "https:" ? url.href : "";
      } catch {
        return "";
      }
    }

    function renderProfile(profile) {
      const fullName =
        profile.full_name || profile.username || "مستخدم NEYRA";

      $("displayName").textContent = fullName;
      $("usernamePreview").textContent = "@" + (profile.username || "user");
      $("bioPreview").textContent = profile.bio || "لسه مفيش نبذة شخصية.";

      $("fullNameView").textContent = fullName;
      $("usernameView").textContent = "@" + (profile.username || "user");
      $("bioView").textContent = profile.bio || "لسه مفيش نبذة شخصية.";

      $("joinedView").textContent = profile.created_at
        ? new Date(profile.created_at).toLocaleDateString("ar-EG", {
            year: "numeric",
            month: "long",
            day: "numeric"
          })
        : "غير متاح";

      const avatar = $("avatarPreview");
      avatar.replaceChildren();

      const imageUrl = safeAvatarUrl(profile.avatar_url);

      if (imageUrl) {
        const img = document.createElement("img");
        img.src = imageUrl;
        img.alt = "صورة الحساب";
        img.referrerPolicy = "no-referrer";

        img.onerror = () => {
          avatar.replaceChildren();
          avatar.textContent = (fullName.trim()[0] || "N").toUpperCase();
        };

        avatar.appendChild(img);
      } else {
        avatar.textContent = (fullName.trim()[0] || "N").toUpperCase();
      }
    }

    async function loadProfile() {
      const { data: sessionData, error: sessionError } =
        await supabase.auth.getSession();

      if (sessionError || !sessionData.session) {
        window.location.replace(loginUrl);
        return;
      }

      const user = sessionData.session.user;

      $("userEmail").textContent =
        user.email || "البريد الإلكتروني غير متاح";

      const { data, error } = await supabase
        .from("profiles")
        .select("id, username, full_name, bio, avatar_url, created_at")
        .eq("id", user.id)
        .maybeSingle();

      if (error) {
        showMessage("تعذر تحميل بيانات الحساب. حاول تحديث الصفحة.", "error");
        console.error(error);
        return;
      }

      if (data) {
        renderProfile(data);
        return;
      }

      const metadata = user.user_metadata || {};
      const username = metadata.username ||
        (user.email || "neyra_user").split("@")[0];

      renderProfile({
        username,
        full_name: metadata.full_name || metadata.name || username,
        bio: "",
        avatar_url: metadata.avatar_url || metadata.picture || "",
        created_at: user.created_at
      });

      showMessage(
        "بيانات الملف الشخصي لسه ما ظهرتش في قاعدة البيانات. جرّب تحديث الصفحة، ولو استمرت المشكلة افتح الإعدادات.",
        "error"
      );
    }

    $("logoutBtn").addEventListener("click", async () => {
      const button = $("logoutBtn");
      button.disabled = true;
      button.textContent = "جارٍ تسجيل الخروج...";

      const { error } = await supabase.auth.signOut();

      if (error) {
        showMessage("تعذر تسجيل الخروج. حاول مرة أخرى.", "error");
        button.disabled = false;
        button.textContent = "تسجيل الخروج";
        return;
      }

      window.location.replace(homeUrl);
    });

    loadProfile();
  </script>
</body>
</html>
