<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080817">
  <title>NERA | عالم الأسرار</title>

  <style>
    :root {
      --cyan: #00f5ff;
      --purple: #a855f7;
      --pink: #ec4899;
      --bg: #080817;
      --text: #f5f3ff;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      width: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      position: relative;
      isolation: isolate;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Tahoma, Arial, sans-serif;
    }

    button, a {
      font: inherit;
    }

    button {
      color: inherit;
    }

    /* الخلفية الأصلية */
    .background {
      position: fixed;
      inset: 0;
      z-index: -3;
      background:
        url("./neyra_images/secrets-world-bg.jpg")
        center center / cover no-repeat;
      transform: scale(1.04);
      animation: backgroundBreath 18s ease-in-out infinite alternate;
    }

    .background::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          180deg,
          rgba(5, 5, 20, .38),
          rgba(7, 5, 25, .48) 45%,
          rgba(4, 3, 18, .82)
        );
    }

    .aurora {
      position: fixed;
      inset: -25%;
      z-index: -2;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 20% 30%,
          rgba(0, 245, 255, .15), transparent 42%),
        radial-gradient(ellipse at 80% 40%,
          rgba(168, 85, 247, .2), transparent 45%),
        radial-gradient(ellipse at 50% 85%,
          rgba(236, 72, 153, .1), transparent 40%);
      filter: blur(24px);
      animation: auroraMove 13s ease-in-out infinite alternate;
    }

    .fog {
      position: fixed;
      inset: -20%;
      z-index: -1;
      pointer-events: none;
      opacity: .36;
      background:
        radial-gradient(ellipse at 20% 55%,
          rgba(160, 190, 255, .19), transparent 40%),
        radial-gradient(ellipse at 70% 45%,
          rgba(180, 100, 255, .17), transparent 42%),
        radial-gradient(ellipse at 45% 80%,
          rgba(0, 240, 255, .11), transparent 45%);
      filter: blur(35px);
      animation: fogDrift 20s ease-in-out infinite alternate;
    }

    #particles {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* الشريط العلوي */
    .topbar {
      position: relative;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 16px clamp(12px, 4vw, 32px);
      background: rgba(7, 6, 22, .56);
      border-bottom: 1px solid rgba(0, 245, 255, .23);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      box-shadow: 0 5px 35px rgba(0, 0, 0, .18);
    }

    .brand {
      direction: ltr;
      font-size: clamp(22px, 5vw, 30px);
      font-weight: 900;
      letter-spacing: 3px;
      color: white;
      text-shadow:
        0 0 7px var(--cyan),
        0 0 19px var(--cyan),
        0 0 35px rgba(168, 85, 247, .85);
      animation: brandGlow 3s ease-in-out infinite alternate;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-button {
      width: 43px;
      height: 43px;
      border: 1px solid rgba(0, 245, 255, .4);
      border-radius: 13px;
      background: rgba(12, 13, 39, .72);
      cursor: pointer;
      font-size: 20px;
      display: grid;
      place-items: center;
      transition: .25s ease;
      box-shadow: 0 0 13px rgba(0, 245, 255, .07);
    }

    .icon-button:hover,
    .icon-button:focus-visible {
      border-color: var(--cyan);
      box-shadow: 0 0 20px rgba(0, 245, 255, .35);
      transform: translateY(-2px);
      outline: none;
    }

    /* القائمة الجانبية */
    .sidebar-shade {
      position: fixed;
      inset: 0;
      z-index: 8;
      background: rgba(0, 0, 0, .64);
      opacity: 0;
      visibility: hidden;
      transition: opacity .3s, visibility .3s;
    }

    .sidebar-shade.open {
      opacity: 1;
      visibility: visible;
    }

    .sidebar {
      position: fixed;
      z-index: 9;
      top: 0;
      right: 0;
      width: min(310px, 86vw);
      height: 100%;
      height: 100dvh;
      padding: 25px 19px;
      background: rgba(8, 7, 27, .97);
      border-left: 1px solid rgba(0, 245, 255, .4);
      box-shadow: -10px 0 45px rgba(0, 0, 0, .4);
      transform: translateX(105%);
      transition: transform .35s cubic-bezier(.2, .8, .2, 1);
      overflow-y: auto;
    }

    .sidebar.open {
      transform: translateX(0);
    }

    .sidebar-heading {
      font-size: 24px;
      margin: 30px 0 22px;
      color: var(--cyan);
      text-shadow: 0 0 17px rgba(0, 245, 255, .5);
    }

    .sidebar-link {
      width: 100%;
      display: block;
      text-align: right;
      padding: 16px;
      margin-bottom: 12px;
      color: white;
      text-decoration: none;
      border: 1px solid rgba(168, 85, 247, .32);
      border-radius: 13px;
      background: linear-gradient(
        110deg,
        rgba(0, 245, 255, .07),
        rgba(168, 85, 247, .12)
      );
      cursor: pointer;
      transition: .25s;
    }

    .sidebar-link:hover {
      border-color: var(--cyan);
      box-shadow: 0 0 18px rgba(0, 245, 255, .16);
      transform: translateX(-3px);
    }

    /* محتوى الصفحة */
    main {
      position: relative;
      z-index: 2;
      width: min(920px, 100%);
      margin: 0 auto;
      padding: clamp(44px, 9vh, 95px) 20px 70px;
      text-align: center;
    }

    .hero {
      animation: heroEnter 1s ease both;
    }

    .hero-brand {
      direction: ltr;
      display: inline-block;
      font-size: clamp(48px, 12vw, 96px);
      line-height: 1.1;
      font-weight: 1000;
      letter-spacing: clamp(5px, 1.5vw, 12px);
      color: #fff;
      text-shadow:
        0 0 5px #fff,
        0 0 16px var(--cyan),
        0 0 34px var(--cyan),
        0 0 65px rgba(168, 85, 247, .95);
      animation: heroGlow 3.2s ease-in-out infinite alternate;
    }

    .hero-title {
      margin: 20px 0 0;
      font-size: clamp(28px, 7vw, 48px);
      font-weight: 900;
      color: #f7edff;
      text-shadow:
        0 0 7px rgba(255, 255, 255, .7),
        0 0 20px var(--purple),
        0 0 42px rgba(0, 245, 255, .55);
      animation: titleGlow 3s ease-in-out infinite alternate;
    }

    .hero-line {
      width: min(260px, 65%);
      height: 2px;
      margin: 25px auto 0;
      background: linear-gradient(
        90deg, transparent, var(--cyan), var(--purple), transparent
      );
      box-shadow: 0 0 16px var(--cyan);
      animation: linePulse 2.4s ease-in-out infinite;
    }

    .sections {
      margin-top: clamp(55px, 10vh, 100px);
      animation: heroEnter .8s .2s ease both;
    }

    .section-heading {
      font-size: clamp(25px, 6vw, 35px);
      margin: 0 0 30px;
      text-shadow: 0 0 17px rgba(0, 245, 255, .42);
    }

    /* زر أسرار العالم */
    .portal-wrap {
      width: min(420px, 100%);
      margin: 0 auto;
      padding: 3px;
      border-radius: 22px;
      position: relative;
      isolation: isolate;
      background: conic-gradient(
        from var(--angle, 0deg),
        var(--cyan),
        #4357ff,
        var(--purple),
        var(--pink),
        var(--cyan)
      );
      animation: borderRotate 4s linear infinite;
      box-shadow:
        0 0 15px rgba(0, 245, 255, .34),
        0 0 35px rgba(168, 85, 247, .25),
        0 0 65px rgba(0, 245, 255, .12);
    }

    .portal-wrap::before,
    .portal-wrap::after {
      content: "";
      position: absolute;
      inset: -8px;
      z-index: -1;
      border-radius: 27px;
      background: conic-gradient(
        from var(--angle, 0deg),
        transparent,
        rgba(0, 245, 255, .75),
        transparent,
        rgba(168, 85, 247, .85),
        transparent
      );
      filter: blur(13px);
      opacity: .65;
      animation: borderRotate 5s linear infinite;
    }

    .portal-wrap::after {
      inset: -15px;
      filter: blur(24px);
      opacity: .3;
      animation-direction: reverse;
    }

    .portal-button {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      width: 100%;
      min-height: 84px;
      padding: 20px 22px;
      border: 0;
      border-radius: 19px;
      cursor: pointer;
      background:
        radial-gradient(ellipse at 50% 0%,
          rgba(0, 245, 255, .16), transparent 65%),
        linear-gradient(135deg,
          rgba(11, 14, 43, .98),
          rgba(23, 10, 49, .98));
      color: #fff;
      font-size: clamp(21px, 5vw, 27px);
      font-weight: 900;
      text-shadow: 0 0 13px rgba(0, 245, 255, .75);
      transition: transform .22s, filter .22s;
      animation: portalBreath 2.8s ease-in-out infinite;
    }

    .portal-button::before {
      content: "";
      position: absolute;
      top: -80%;
      left: -60%;
      width: 40%;
      height: 260%;
      transform: rotate(24deg);
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, .28),
        transparent
      );
      animation: portalShine 4s ease-in-out infinite;
      pointer-events: none;
    }

    .portal-button::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      border-radius: inherit;
      background: radial-gradient(
        circle at var(--touch-x, 50%) var(--touch-y, 50%),
        rgba(0, 245, 255, .28), transparent 55%
      );
      opacity: .7;
    }

    .portal-button:hover,
    .portal-button:focus-visible {
      transform: scale(1.025);
      filter: brightness(1.25);
      outline: none;
    }

    .portal-button:active {
      transform: scale(.97);
    }

    .portal-symbol {
      display: inline-block;
      margin-left: 10px;
      color: var(--cyan);
      text-shadow: 0 0 13px var(--cyan);
      animation: symbolPulse 1.7s ease-in-out infinite;
    }

    .hint {
      margin-top: 23px;
      color: rgba(237, 235, 255, .78);
      font-size: 14px;
      line-height: 1.9;
    }

    .status {
      min-height: 26px;
      margin-top: 15px;
      color: #b8faff;
      font-size: 14px;
    }

    .footer {
      margin-top: 70px;
      color: rgba(255, 255, 255, .48);
      font-size: 12px;
      letter-spacing: 1px;
    }

    .ripple {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 4;
      border: 2px solid rgba(0, 245, 255, .9);
      box-shadow: 0 0 20px var(--cyan);
      animation: rippleOut .75s ease-out forwards;
    }

    .toast {
      position: fixed;
      z-index: 20;
      bottom: 25px;
      left: 50%;
      transform: translate(-50%, 20px);
      width: max-content;
      max-width: calc(100% - 32px);
      padding: 13px 20px;
      border: 1px solid rgba(0, 245, 255, .45);
      border-radius: 13px;
      background: rgba(9, 8, 30, .96);
      color: white;
      text-align: center;
      box-shadow: 0 0 24px rgba(0, 245, 255, .18);
      opacity: 0;
      visibility: hidden;
      transition: .25s;
    }

    .toast.show {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, 0);
    }

    @keyframes backgroundBreath {
      from { transform: scale(1.04); }
      to { transform: scale(1.1); }
    }

    @keyframes auroraMove {
      from { transform: translate(-3%, -2%) rotate(0deg); }
      to { transform: translate(4%, 3%) rotate(8deg); }
    }

    @keyframes fogDrift {
      from { transform: translate(-4%, 2%) scale(1); }
      to { transform: translate(5%, -3%) scale(1.12); }
    }

    @keyframes brandGlow {
      from { filter: brightness(.9); }
      to { filter: brightness(1.35); }
    }

    @keyframes heroGlow {
      from { filter: brightness(.85); }
      to { filter: brightness(1.3); }
    }

    @keyframes titleGlow {
      from { filter: brightness(.85); }
      to { filter: brightness(1.25); }
    }

    @keyframes linePulse {
      0%, 100% { opacity: .55; transform: scaleX(.82); }
      50% { opacity: 1; transform: scaleX(1.06); }
    }

    @keyframes heroEnter {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes borderRotate {
      to { --angle: 360deg; }
    }

    @keyframes portalBreath {
      0%, 100% {
        box-shadow: inset 0 0 15px rgba(0, 245, 255, .05);
      }
      50% {
        box-shadow:
          inset 0 0 24px rgba(168, 85, 247, .18),
          inset 0 0 10px rgba(0, 245, 255, .12);
      }
    }

    @keyframes portalShine {
      0%, 15% { left: -60%; }
      55%, 100% { left: 130%; }
    }

    @keyframes symbolPulse {
      0%, 100% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.18); filter: brightness(1.5); }
    }

    @keyframes rippleOut {
      to {
        width: 250px;
        height: 250px;
        opacity: 0;
        margin: -125px 0 0 -125px;
      }
    }

    @property --angle {
      syntax: "<angle>";
      initial-value: 0deg;
      inherits: false;
    }

    @media (max-width: 480px) {
      .topbar { padding: 12px; }
      .icon-button { width: 40px; height: 40px; }
      main { padding-top: 60px; }
      .sections { margin-top: 65px; }
      .portal-button { min-height: 76px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <div class="background" aria-hidden="true"></div>
  <div class="aurora" aria-hidden="true"></div>
  <div class="fog" aria-hidden="true"></div>
  <canvas id="particles" aria-hidden="true"></canvas>

  <header class="topbar">
    <button
      class="icon-button"
      id="menuButton"
      type="button"
      aria-label="فتح القائمة"
      aria-expanded="false"
    >☰</button>

    <div class="brand">NERA</div>

    <div class="top-actions">
      <button
        class="icon-button"
        id="soundButton"
        type="button"
        aria-label="تشغيل الموسيقى"
        title="تشغيل أو إيقاف الصوت"
      >🔇</button>

      <button
        class="icon-button"
        id="fullscreenButton"
        type="button"
        aria-label="ملء الشاشة"
        title="ملء الشاشة"
      >⛶</button>
    </div>
  </header>

  <div class="sidebar-shade" id="sidebarShade"></div>

  <aside class="sidebar" id="sidebar" aria-hidden="true">
    <button
      class="icon-button"
      id="closeMenuButton"
      type="button"
      aria-label="إغلاق القائمة"
    >✕</button>

    <h2 class="sidebar-heading">الأقسام</h2>

    <button class="sidebar-link" id="sidebarSecrets" type="button">
      ✧ أسرار العالم
    </button>
  </aside>

  <main>
    <section class="hero">
      <div class="hero-brand">NERA</div>
      <h1 class="hero-title">عالم الأسرار</h1>
      <div class="hero-line"></div>
    </section>

    <section class="sections">
      <h2 class="section-heading">الأقسام</h2>

      <div class="portal-wrap">
        <button class="portal-button" id="secretsButton" type="button">
          <span class="portal-symbol">✧</span>
          أسرار العالم
        </button>
      </div>

      <p class="hint">
        خلف الضباب حكايات لم تُكشف بعد...
        <br>
        فعّل الصوت لو عايز تعيش الأجواء الغامضة.
      </p>

      <div class="status" id="soundStatus" aria-live="polite"></div>
    </section>

    <footer class="footer">NERA · BEYOND THE FOG</footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      "use strict";

      const menuButton = document.getElementById("menuButton");
      const closeMenuButton = document.getElementById("closeMenuButton");
      const sidebar = document.getElementById("sidebar");
      const sidebarShade = document.getElementById("sidebarShade");
      const soundButton = document.getElementById("soundButton");
      const fullscreenButton = document.getElementById("fullscreenButton");
      const secretsButton = document.getElementById("secretsButton");
      const sidebarSecrets = document.getElementById("sidebarSecrets");
      const toast = document.getElementById("toast");
      const soundStatus = document.getElementById("soundStatus");

      let toastTimer;
      let audioContext = null;
      let masterGain = null;
      let musicGain = null;
      let musicNodes = [];
      let soundEnabled = false;

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toast.classList.remove("show");
        }, 2600);
      }

      function setMenu(open) {
        sidebar.classList.toggle("open", open);
        sidebarShade.classList.toggle("open", open);
        menuButton.setAttribute("aria-expanded", String(open));
        sidebar.setAttribute("aria-hidden", String(!open));
      }

      menuButton.addEventListener("click", () => {
        setMenu(!sidebar.classList.contains("open"));
        playEffect("menu");
      });

      closeMenuButton.addEventListener("click", () => {
        setMenu(false);
        playEffect("click");
      });

      sidebarShade.addEventListener("click", () => setMenu(false));

      document.addEventListener("keydown", event => {
        if (event.key === "Escape") setMenu(false);
      });

      function initAudio() {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;

        if (!AudioCtx) {
          showToast("المتصفح لا يدعم تشغيل الصوت هنا");
          return false;
        }

        if (!audioContext) {
          audioContext = new AudioCtx();

          masterGain = audioContext.createGain();
          masterGain.gain.value = 0.65;
          masterGain.connect(audioContext.destination);

          musicGain = audioContext.createGain();
          musicGain.gain.value = 0;
          musicGain.connect(masterGain);
        }

        if (audioContext.state === "suspended") {
          audioContext.resume().catch(() => {});
        }

        return true;
      }

      function startMusic() {
        if (!initAudio()) return;

        if (musicNodes.length === 0) {
          const now = audioContext.currentTime;

          // نغمات منخفضة متداخلة لصناعة أجواء غامضة.
          const tones = [
            { frequency: 55, volume: 0.13 },
            { frequency: 82.41, volume: 0.07 },
            { frequency: 110, volume: 0.045 },
            { frequency: 164.81, volume: 0.025 }
          ];

          tones.forEach((tone, index) => {
            const oscillator = audioContext.createOscillator();
            const gain = audioContext.createGain();
            const filter = audioContext.createBiquadFilter();

            oscillator.type = index === 1 ? "triangle" : "sine";
            oscillator.frequency.value = tone.frequency;
            filter.type = "lowpass";
            filter.frequency.value = 450;

            gain.gain.value = tone.volume;

            oscillator.connect(filter);
            filter.connect(gain);
            gain.connect(musicGain);

            oscillator.start(now);
            musicNodes.push({ oscillator, gain, filter });
          });

          // نبضات بطيئة لتقليل إحساس الصوت بأنه نغمة ثابتة.
          const lfo = audioContext.createOscillator();
          const lfoGain = audioContext.createGain();
          lfo.frequency.value = 0.12;
          lfoGain.gain.value = 0.035;
          lfo.connect(lfoGain);
          lfoGain.connect(musicGain.gain);
          lfo.start(now);
          musicNodes.push({ oscillator: lfo, gain: lfoGain, filter: null });
        }

        const now = audioContext.currentTime;
        musicGain.gain.cancelScheduledValues(now);
        musicGain.gain.setTargetAtTime(0.42, now, 0.8);

        soundEnabled = true;
        soundButton.textContent = "🔊";
        soundButton.setAttribute("aria-label", "إيقاف الموسيقى");
        soundStatus.textContent = "الصوت يعمل";
      }

      function stopMusic() {
        if (!audioContext || !musicGain) return;

        const now = audioContext.currentTime;
        musicGain.gain.cancelScheduledValues(now);
        musicGain.gain.setTargetAtTime(0, now, 0.35);

        soundEnabled = false;
        soundButton.textContent = "🔇";
        soundButton.setAttribute("aria-label", "تشغيل الموسيقى");
        soundStatus.textContent = "الصوت متوقف";
      }

      function playEffect(type) {
        if (!soundEnabled || !initAudio()) return;

        const now = audioContext.currentTime;
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        const settings = {
          click: { frequency: 620, end: 310, duration: 0.12, volume: 0.11 },
          menu: { frequency: 360, end: 680, duration: 0.2, volume: 0.1 },
          portal: { frequency: 190, end: 920, duration: 0.42, volume: 0.16 }
        };

        const setting = settings[type] || settings.click;
        oscillator.type = type === "portal" ? "sine" : "triangle";
        oscillator.frequency.setValueAtTime(setting.frequency, now);
        oscillator.frequency.exponentialRampToValueAtTime(
          setting.end, now + setting.duration
        );

        gain.gain.setValueAtTime(setting.volume, now);
        gain.gain.exponentialRampToValueAtTime(
          0.001, now + setting.duration
        );

        oscillator.connect(gain);
        gain.connect(masterGain);
        oscillator.start(now);
        oscillator.stop(now + setting.duration + 0.03);
      }

      soundButton.addEventListener("click", () => {
        if (soundEnabled) {
          stopMusic();
          playEffect("click");
        } else {
          startMusic();
          if (soundEnabled) playEffect("menu");
        }
      });

      fullscreenButton.addEventListener("click", async () => {
        try {
          if (!document.fullscreenElement) {
            await document.documentElement.requestFullscreen();
            fullscreenButton.textContent = "⤢";
          } else {
            await document.exitFullscreen();
            fullscreenButton.textContent = "⛶";
          }
        } catch {
          showToast("ملء الشاشة غير متاح في المتصفح ده");
        }

        playEffect("click");
      });

      document.addEventListener("fullscreenchange", () => {
        fullscreenButton.textContent =
          document.fullscreenElement ? "⤢" : "⛶";
      });

      
      function openSecrets() {
        playEffect("portal");
        setMenu(false);

        secretsButton.animate(
          [
            { filter: "brightness(1)", transform: "scale(1)" },
            { filter: "brightness(1.8)", transform: "scale(1.04)" },
            { filter: "brightness(1)", transform: "scale(1)" }
          ],
          { duration: 650, easing: "ease-out" }
        );

        showToast("جاري فتح عالم الأسرار ✧");

        setTimeout(() => {
          window.location.href = "world-secrets.html";
        }, 650);
      }


      secretsButton.addEventListener("click", event => {
        addRipple(event, secretsButton);
        openSecrets();
      });

      sidebarSecrets.addEventListener("click", openSecrets);

      function addRipple(event, element) {
        const rect = element.getBoundingClientRect();
        const ripple = document.createElement("span");
        ripple.className = "ripple";

        const x = event.clientX ? event.clientX - rect.left : rect.width / 2;
        const y = event.clientY ? event.clientY - rect.top : rect.height / 2;

        ripple.style.left = x + "px";
        ripple.style.top = y + "px";
        element.appendChild(ripple);

        setTimeout(() => ripple.remove(), 850);
      }

      /* جسيمات خفيفة مع مراعاة حجم شاشة الهاتف. */
      const canvas = document.getElementById("particles");
      const ctx = canvas.getContext("2d");
      const reducedMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      ).matches;

      let width = 0;
      let height = 0;
      let particles = [];
      let animationFrame = null;

      function resizeCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
        width = window.innerWidth;
        height = window.innerHeight;

        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const count = reducedMotion
          ? 12
          : Math.min(65, Math.max(24, Math.floor(width / 7)));

        particles = Array.from({ length: count }, () => ({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: Math.random() * 1.8 + 0.5,
          speed: Math.random() * 0.35 + 0.12,
          drift: (Math.random() - 0.5) * 0.35,
          alpha: Math.random() * 0.65 + 0.2,
          phase: Math.random() * Math.PI * 2
        }));
      }

      function drawParticles() {
        ctx.clearRect(0, 0, width, height);

        for (const p of particles) {
          if (!reducedMotion) {
            p.y -= p.speed;
            p.x += p.drift;
            p.phase += 0.025;
          }

          if (p.y < -5) {
            p.y = height + 5;
            p.x = Math.random() * width;
          }

          if (p.x < -5) p.x = width + 5;
          if (p.x > width + 5) p.x = -5;

          const glow = 0.55 + Math.sin(p.phase) * 0.3;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(115, 235, 255, ${p.alpha * glow})`;
          ctx.shadowBlur = reducedMotion ? 0 : 10;
          ctx.shadowColor = "#00eaff";
          ctx.fill();
        }

        ctx.shadowBlur = 0;

        if (!reducedMotion) {
          animationFrame = requestAnimationFrame(drawParticles);
        }
      }

      window.addEventListener("resize", resizeCanvas, { passive: true });
      resizeCanvas();
      drawParticles();

      /* لو المستخدم ضغط أي مكان لتفعيل الصوت، نحترم إعداداته. */
      document.addEventListener("visibilitychange", () => {
        if (document.hidden && audioContext && soundEnabled) {
          // لا نوقف الموسيقى تلقائيًا؛ المتصفح قد يقيّدها في الخلفية.
        }
      });
    })();
  </script>
</body>
