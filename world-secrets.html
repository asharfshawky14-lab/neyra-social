<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050309">
<title>NEYRA | عالم الأسرار</title>

<style>
:root{
  --night:#050309;
  --deep:#160921;
  --violet:#7023a5;
  --electric:#9d50d4;
  --pale:#cda3ed;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:var(--night);color:#f5edfc;font-family:Tahoma,Arial,sans-serif}
body{overflow:hidden}
button{font:inherit}
.world{position:relative;isolation:isolate;width:100%;height:100vh;height:100dvh;min-height:500px;overflow:hidden;background:#08050c}
.city{
  position:absolute;z-index:-8;inset:-4%;
  background:
    linear-gradient(180deg,rgba(4,2,8,.16),rgba(5,2,9,.05) 45%,rgba(4,2,8,.56)),
    url("neyra_images/secrets-world.jpg") center center/cover no-repeat;
  transform:scale(1.06);
  animation:cityMove 26s ease-in-out infinite alternate;
  will-change:transform
}
.shade{position:absolute;z-index:-6;inset:0;pointer-events:none;background:
  radial-gradient(ellipse at 50% 45%,transparent 10%,rgba(5,2,9,.12) 57%,rgba(2,1,5,.7) 100%),
  linear-gradient(0deg,rgba(4,2,8,.68),transparent 43%,rgba(4,2,8,.2))}
.sky-glow{position:absolute;z-index:-5;inset:-20%;pointer-events:none;
  background:radial-gradient(ellipse at 52% 35%,rgba(61,20,86,.18),transparent 54%);
  animation:skyPulse 7s ease-in-out infinite alternate}
.fog{position:absolute;z-index:-3;inset:-30%;pointer-events:none;opacity:.23;filter:blur(24px);
  background:
    radial-gradient(ellipse at 15% 75%,rgba(76,26,108,.45),transparent 32%),
    radial-gradient(ellipse at 80% 68%,rgba(63,21,93,.42),transparent 30%),
    radial-gradient(ellipse at 50% 94%,rgba(34,15,52,.72),transparent 36%);
  animation:fogMove 19s ease-in-out infinite alternate}
.fog.two{opacity:.17;filter:blur(35px);animation-duration:29s;animation-direction:alternate-reverse}
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:4;pointer-events:none}
.lightning{position:absolute;z-index:3;inset:0;opacity:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 23%,rgba(120,64,164,.26),transparent 55%);
  mix-blend-mode:screen}
.lightning.flash{animation:skyFlash .55s ease-out}
.topbar{position:absolute;z-index:8;top:max(20px,env(safe-area-inset-top));left:0;right:0;padding:0 22px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:19px;font-weight:900;letter-spacing:4px;color:#d4b6eb;text-shadow:0 0 16px #52246e}
.world-tag{font-size:9px;letter-spacing:2px;color:rgba(215,188,236,.65);direction:ltr}
.scene{position:absolute;z-index:2;left:50%;top:43%;width:min(66vw,340px);aspect-ratio: .78;transform:translate(-50%,-50%);transition:transform 1.5s cubic-bezier(.15,.7,.15,1),filter 1s}
.ground-glow{position:absolute;left:-25%;right:-25%;bottom:-3%;height:19%;border-radius:50%;
  background:radial-gradient(ellipse,rgba(90,32,124,.27),transparent 68%);filter:blur(13px)}
/* البوابة: شق طاقة رأسي غير منتظم */
.gate{position:absolute;inset:5% 8% 8%;filter:drop-shadow(0 0 8px rgba(105,48,145,.4))}
.gate-back{
  position:absolute;inset:7% 10% 4%;border-radius:48% 49% 35% 38%/28% 30% 18% 19%;
  background:radial-gradient(ellipse at 50% 45%,#190a25 0%,#0b0611 42%,#050309 73%);
  clip-path:polygon(49% 0,62% 7%,69% 18%,81% 25%,76% 38%,88% 50%,75% 63%,79% 75%,64% 89%,51% 100%,35% 91%,24% 79%,29% 65%,14% 54%,24% 42%,18% 28%,33% 18%,38% 7%);
  box-shadow:inset 0 0 40px #321343;
}
.gate-rim{
  position:absolute;inset:1% 1% 1%;
  border-radius:47% 51% 35% 39%/28% 31% 18% 20%;
  background:conic-gradient(from 15deg,transparent 0 7%,#4e2167 9%,#a56bc4 10%,transparent 12% 24%,#3a164d 27%,#9a55bd 29%,transparent 31% 48%,#57236e 52%,#b17ad1 54%,transparent 57% 76%,#4b1c65 79%,#a36ac0 81%,transparent 84%);
  clip-path:polygon(49% 0,62% 7%,69% 18%,81% 25%,76% 38%,88% 50%,75% 63%,79% 75%,64% 89%,51% 100%,35% 91%,24% 79%,29% 65%,14% 54%,24% 42%,18% 28%,33% 18%,38% 7%);
  filter:drop-shadow(0 0 6px rgba(138,68,178,.8));
  animation:rimPulse 3.4s ease-in-out infinite alternate
}
.gate-inner{
  position:absolute;inset:13% 18% 12%;overflow:hidden;
  border-radius:48% 50% 35% 35%/27% 29% 19% 19%;
  background:radial-gradient(ellipse at 48% 48%,#351442 0%,#170821 35%,#08040d 73%,#030207 100%);
  clip-path:polygon(49% 0,62% 7%,69% 18%,81% 25%,76% 38%,88% 50%,75% 63%,79% 75%,64% 89%,51% 100%,35% 91%,24% 79%,29% 65%,14% 54%,24% 42%,18% 28%,33% 18%,38% 7%);
  box-shadow:inset 0 0 35px #050208
}
.vortex{
  position:absolute;inset:-30%;border-radius:50%;
  background:conic-gradient(from 0deg,transparent,#3d1758 15%,#a45ac8 19%,transparent 26%,#1a0927 42%,#71328f 51%,transparent 60%,#351143 76%,#a05dbb 82%,transparent 91%);
  opacity:.68;filter:blur(5px);animation:vortexSpin 13s linear infinite
}
.vortex.v2{inset:3%;opacity:.38;filter:blur(8px);animation-duration:8s;animation-direction:reverse}
.core-dark{position:absolute;inset:18%;border-radius:50%;background:radial-gradient(ellipse,#050309 0%,rgba(8,3,14,.91) 45%,transparent 74%)}
.energy-arc{position:absolute;inset:8%;border:1px solid rgba(171,113,204,.58);border-radius:50%;
  transform:rotate(-25deg) scaleX(.65);box-shadow:0 0 12px rgba(116,54,151,.22);animation:arcTurn 8s linear infinite}
.energy-arc.a2{inset:18% 4%;transform:rotate(58deg) scaleX(.7);border-color:rgba(112,65,143,.5);animation-duration:11s;animation-direction:reverse}
.rune{position:absolute;color:rgba(193,150,219,.8);font-size:18px;text-shadow:0 0 10px #713b8e;animation:runeFloat 4s ease-in-out infinite alternate}
.r1{top:0;left:47%}.r2{top:26%;right:0;animation-delay:-1s}.r3{bottom:9%;left:12%;animation-delay:-2s}.r4{left:0;top:57%;animation-delay:-.7s}.r5{right:9%;bottom:12%;animation-delay:-1.6s}
.crack{position:absolute;width:3px;background:linear-gradient(180deg,transparent,#b47bd2,rgba(126,54,160,.7),transparent);
  filter:drop-shadow(0 0 4px #8845a9);opacity:.65;transform-origin:top}
.c1{height:26%;left:27%;top:19%;transform:rotate(26deg);clip-path:polygon(0 0,100% 0,42% 37%,90% 40%,25% 100%,35% 43%,0 49%)}
.c2{height:21%;right:24%;top:54%;transform:rotate(-32deg);clip-path:polygon(0 0,100% 0,55% 30%,80% 38%,25% 100%,38% 42%,0 48%)}
.c3{height:17%;left:49%;top:8%;transform:rotate(8deg);opacity:.4}
.scene-aura{position:absolute;inset:-13%;border-radius:50%;background:radial-gradient(ellipse,rgba(72,25,97,.13),transparent 65%);filter:blur(17px);animation:aura 4s ease-in-out infinite alternate}
.intro{position:absolute;z-index:7;left:0;right:0;bottom:max(30px,env(safe-area-inset-bottom));padding:0 20px;display:flex;flex-direction:column;align-items:center;text-align:center;transition:opacity .8s,transform .8s}
.eyebrow{font-size:10px;letter-spacing:3px;color:#b99acb;opacity:0;animation:reveal 1s ease .5s forwards}
h1{font-size:clamp(35px,8vw,56px);margin:10px 0 0;line-height:1.3;color:#e5d1f1;
  text-shadow:0 2px 20px #13091b,0 0 22px rgba(105,54,135,.45);opacity:0;animation:titleIn 1.2s ease .8s forwards}
.subtitle{font-size:12px;line-height:1.9;color:rgba(224,209,235,.82);max-width:330px;margin:8px 0 18px;opacity:0;animation:reveal 1s ease 1.2s forwards}
.enter{position:relative;min-height:49px;padding:13px 27px;border:1px solid rgba(157,105,185,.7);border-radius:5px;color:#f1e5f9;background:linear-gradient(110deg,rgba(27,12,39,.96),rgba(66,28,85,.95),rgba(19,8,29,.96));box-shadow:0 0 19px rgba(72,30,98,.24),inset 0 0 14px rgba(153,93,182,.09);cursor:pointer;overflow:hidden;opacity:0;animation:reveal 1s ease 1.5s forwards,buttonPulse 4s ease-in-out 2.5s infinite}
.enter:before{content:"";position:absolute;top:0;bottom:0;left:-70%;width:40%;background:linear-gradient(90deg,transparent,rgba(213,172,237,.2),transparent);transform:skewX(-25deg);animation:shine 5s ease-in-out 3s infinite}
.skip{margin-top:10px;border:0;background:transparent;color:rgba(212,190,226,.55);font-size:10px;padding:8px 12px;cursor:pointer;opacity:0;animation:reveal 1s ease 1.8s forwards}
.bottom-label{position:absolute;z-index:6;left:17px;bottom:max(15px,env(safe-area-inset-bottom));font-size:8px;letter-spacing:2px;color:rgba(200,176,215,.4);direction:ltr}
.arrival{position:absolute;z-index:12;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:25px;background:rgba(5,3,9,.96);opacity:0;visibility:hidden;transition:opacity 1s}
.arrival.visible{opacity:1;visibility:visible}
.arrival-symbol{font-size:48px;color:#a779c3;text-shadow:0 0 22px #5b2878;animation:runeFloat 2s ease-in-out infinite alternate}
.arrival h2{font-size:28px;color:#e7d5f2;margin:16px 0 5px}
.arrival p{font-size:13px;line-height:1.9;color:#bda8cc;max-width:310px}
.arrival a{margin-top:16px;padding:12px 23px;border:1px solid #67417b;border-radius:5px;color:#eadbf5;text-decoration:none;background:#180d21}
.crossing .scene{transform:translate(-50%,-50%) scale(7);filter:brightness(1.8)}
.crossing .city{animation:none;transform:scale(1.45);filter:brightness(1.7) saturate(1.4);transition:transform 2s,filter 1s}
.crossing .intro,.crossing .topbar,.crossing .bottom-label{opacity:0;transform:translateY(20px);pointer-events:none}
.crossing .fog{opacity:.65;filter:blur(12px)}
@keyframes cityMove{from{transform:scale(1.06) translate3d(0,0,0)}to{transform:scale(1.13) translate3d(-.6%,-.6%,0)}}
@keyframes skyPulse{from{opacity:.3}to{opacity:.85}}
@keyframes fogMove{from{transform:translate3d(-4%,2%,0) rotate(-3deg)}to{transform:translate3d(5%,-3%,0) rotate(4deg)}}
@keyframes skyFlash{0%,100%{opacity:0}10%{opacity:.85}22%{opacity:.08}34%{opacity:.65}47%{opacity:0}}
@keyframes rimPulse{from{filter:brightness(.65) drop-shadow(0 0 4px #4b1b63)}to{filter:brightness(1.2) drop-shadow(0 0 12px #8445a5)}}
@keyframes vortexSpin{to{transform:rotate(360deg)}}
@keyframes arcTurn{to{rotate:360deg}}
@keyframes runeFloat{from{translate:0 0;rotate:-7deg}to{translate:0 -7px;rotate:7deg}}
@keyframes aura{from{opacity:.35;scale:.92}to{opacity:.8;scale:1.08}}
@keyframes reveal{from{opacity:0;translate:0 12px}to{opacity:1;translate:0 0}}
@keyframes titleIn{from{opacity:0;translate:0 18px;filter:blur(6px)}to{opacity:1;translate:0 0;filter:blur(0)}}
@keyframes buttonPulse{0%,100%{box-shadow:0 0 12px rgba(83,39,107,.2)}50%{box-shadow:0 0 24px rgba(112,57,145,.42)}}
@keyframes shine{0%,70%{left:-70%}90%,100%{left:140%}}
@media(max-width:600px){
  .scene{width:min(68vw,290px);top:39%}
  .intro{bottom:max(27px,env(safe-area-inset-bottom))}
  .subtitle{margin:7px 0 14px;max-width:290px}
  .topbar{padding-inline:17px}
  .fog{filter:blur(20px)}
}
@media(max-height:650px){
  .scene{width:min(48vh,250px);top:39%}
  .intro{bottom:15px}
  h1{font-size:32px;margin-top:5px}
  .subtitle{margin:4px 0 9px}
  .enter{min-height:43px;padding:10px 23px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}
}
</style>
</head>
<body>
<main class="world" id="world">
  <div class="city"></div>
  <div class="shade"></div>
  <div class="sky-glow"></div>
  <div class="fog"></div>
  <div class="fog two"></div>
  <div class="lightning" id="lightning"></div>
  <canvas id="fx" aria-hidden="true"></canvas>

  <header class="topbar">
    <div class="brand">NEYRA</div>
    <div class="world-tag">WORLD 01 · SECRETS</div>
  </header>

  <div class="scene" id="scene" aria-hidden="true">
    <div class="scene-aura"></div>
    <div class="ground-glow"></div>
    <div class="gate">
      <div class="gate-back"></div>
      <div class="gate-rim"></div>
      <div class="gate-inner">
        <div class="vortex"></div>
        <div class="vortex v2"></div>
        <div class="core-dark"></div>
        <div class="energy-arc"></div>
        <div class="energy-arc a2"></div>
      </div>
      <div class="crack c1"></div>
      <div class="crack c2"></div>
      <div class="crack c3"></div>
    </div>
    <span class="rune r1">✧</span>
    <span class="rune r2">ᛟ</span>
    <span class="rune r3">✦</span>
    <span class="rune r4">ᚷ</span>
    <span class="rune r5">◇</span>
  </div>

  <section class="intro" id="intro">
    <div class="eyebrow">BEYOND THE SILENCE</div>
    <h1>عالم الأسرار</h1>
    <p class="subtitle">خلف هذا الضباب، تختبئ حكايات لم تُروَ بعد. اقترب... واكتشف ما وراء الصمت.</p>
    <button class="enter" id="enter">✦ ادخل عالم الأسرار</button>
    <button class="skip" id="skip">تخطي المقدمة</button>
  </section>

  <div class="bottom-label">A NEYRA EXPERIENCE</div>

  <section class="arrival" id="arrival" aria-live="polite">
    <div class="arrival-symbol">✧</div>
    <h2>لقد عبرت البوابة</h2>
    <p>استعد لاكتشاف ما وراء الضباب. سنربط العالم الداخلي في المرحلة التالية.</p>
    <a href="index.html">العودة إلى NEYRA</a>
  </section>
</main>

<script>
(()=>{
  const world=document.getElementById("world");
  const scene=document.getElementById("scene");
  const lightning=document.getElementById("lightning");
  const enter=document.getElementById("enter");
  const skip=document.getElementById("skip");
  const arrival=document.getElementById("arrival");
  const canvas=document.getElementById("fx");
  const ctx=canvas.getContext("2d");
  if(!ctx)return;

  const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let w=0,h=0,dpr=1,frame=0,last=0,crossed=false,boltTimer;
  let dust=[],bolts=[],bursts=[];
  const mobile=matchMedia("(max-width:600px)").matches;
  const count=reduced?0:(mobile?52:100);

  function resize(){
    dpr=Math.min(devicePixelRatio||1,1.5);
    w=innerWidth;h=innerHeight;
    canvas.width=Math.round(w*dpr);
    canvas.height=Math.round(h*dpr);
    canvas.style.width=w+"px";canvas.style.height=h+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
    dust=Array.from({length:count},()=>particle(true));
  }

  function particle(anywhere=false){
    return{
      x:w*.2+Math.random()*w*.6,
      y:anywhere?Math.random()*h:h+Math.random()*40,
      vx:(Math.random()-.5)*.65,
      vy:-(Math.random()*.7+.2),
      r:Math.random()*1.8+.4,
      a:Math.random()*.55+.15,
      phase:Math.random()*6.28
    };
  }

  function makeBolt(x,y,length,spread,depth){
    const pts=[{x,y}];
    let px=x,py=y;
    for(let i=0;i<depth;i++){
      px+=(Math.random()-.5)*spread;
      py+=length/depth*(.7+Math.random()*.6);
      pts.push({x:px,y:py});
    }
    return pts;
  }

  function strike(){
    if(crossed||document.hidden||reduced)return;
    const x=w*(.18+Math.random()*.64);
    const y=h*(.03+Math.random()*.15);
    bolts.push({pts:makeBolt(x,y,h*(.17+Math.random()*.28),w*.15,9),life:1,branch:Math.random()>.4});
    lightning.classList.remove("flash");
    void lightning.offsetWidth;
    lightning.classList.add("flash");
    if(Math.random()>.35){
      setTimeout(()=>{
        if(crossed||document.hidden)return;
        bolts.push({pts:makeBolt(w*(.2+Math.random()*.6),h*.02,h*.2,w*.12,8),life:.8,branch:false});
      },100);
    }
    scheduleStrike();
  }

  function scheduleStrike(){
    clearTimeout(boltTimer);
    boltTimer=setTimeout(strike,2300+Math.random()*3900);
  }

  function drawBolt(b){
    const p=b.pts;
    ctx.save();
    ctx.globalAlpha=Math.max(0,b.life);
    ctx.lineJoin="round";ctx.lineCap="round";
    ctx.beginPath();ctx.moveTo(p[0].x,p[0].y);
    for(let i=1;i<p.length;i++)ctx.lineTo(p[i].x,p[i].y);
    ctx.strokeStyle="#7f42a7";ctx.lineWidth=5;ctx.shadowBlur=22;ctx.shadowColor="#8848b1";ctx.stroke();
    ctx.beginPath();ctx.moveTo(p[0].x,p[0].y);
    for(let i=1;i<p.length;i++)ctx.lineTo(p[i].x,p[i].y);
    ctx.strokeStyle="#d4b0ec";ctx.lineWidth=1.3;ctx.shadowBlur=9;ctx.shadowColor="#c08ce2";ctx.stroke();
    if(b.branch&&p.length>4){
      const j=Math.floor(p.length*.45),q=p[j];
      ctx.beginPath();ctx.moveTo(q.x,q.y);
      let bx=q.x,by=q.y;
      for(let i=0;i<4;i++){bx+=(Math.random()-.5)*25;by+=12;ctx.lineTo(bx,by)}
      ctx.strokeStyle="#9866ba";ctx.lineWidth=1.2;ctx.stroke();
    }
    ctx.restore();
  }

  function drawDust(time){
    ctx.save();
    for(const p of dust){
      p.x+=p.vx+Math.sin(time*.0008+p.phase)*.25;
      p.y+=p.vy;
      if(p.y< -10){Object.assign(p,particle());}
      if(p.x<0)p.x=w;if(p.x>w)p.x=0;
      const a=p.a*(.6+.4*Math.sin(time*.002+p.phase));
      ctx.globalAlpha=a;
      ctx.fillStyle="#b68acb";
      ctx.shadowColor="#8a4fa9";ctx.shadowBlur=9;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }

  function drawBursts(){
    for(let i=bursts.length-1;i>=0;i--){
      const b=bursts[i];
      b.r+=b.speed;b.life-=.018;
      ctx.save();ctx.globalAlpha=Math.max(0,b.life);
      ctx.strokeStyle="#a970ca";ctx.lineWidth=1.5;
      ctx.shadowColor="#9b55c3";ctx.shadowBlur=16;
      ctx.beginPath();ctx.ellipse(b.x,b.y,b.r,b.r*1.35,0,0,Math.PI*2);ctx.stroke();
      ctx.restore();
      if(b.life<=0)bursts.splice(i,1);
    }
  }

  function render(time){
    if(document.hidden){frame=0;return;}
    if(time-last<28){frame=requestAnimationFrame(render);return;}
    last=time;ctx.clearRect(0,0,w,h);
    if(!crossed)drawDust(time);
    for(let i=bolts.length-1;i>=0;i--){
      drawBolt(bolts[i]);bolts[i].life-=.065;
      if(bolts[i].life<=0)bolts.splice(i,1);
    }
    drawBursts();
    frame=requestAnimationFrame(render);
  }

  function start(){
    if(!frame&&!document.hidden)frame=requestAnimationFrame(render);
  }

  function cross(){
    if(crossed)return;
    crossed=true;clearTimeout(boltTimer);
    bursts=[];
    const rect=scene.getBoundingClientRect();
    for(let i=0;i<5;i++)bursts.push({
      x:rect.left+rect.width/2,
      y:rect.top+rect.height/2,
      r:10+i*12,speed:5+i*1.6,life:1
    });
    bolts.push({pts:makeBolt(w*.25,0,h*.7,w*.4,14),life:1,branch:true});
    bolts.push({pts:makeBolt(w*.75,0,h*.7,w*.4,14),life:1,branch:true});
    world.classList.add("crossing");
    lightning.classList.remove("flash");void lightning.offsetWidth;
    lightning.classList.add("flash");
    setTimeout(()=>arrival.classList.add("visible"),1800);
  }

  function move(clientX,clientY){
    if(crossed||reduced)return;
    const dx=(clientX/w-.5)*5;
    const dy=(clientY/h-.5)*5;
    scene.style.marginLeft=dx+"px";
    scene.style.marginTop=dy+"px";
  }

  world.addEventListener("pointermove",e=>move(e.clientX,e.clientY),{passive:true});
  world.addEventListener("pointerdown",e=>{
    if(crossed||e.target.closest("button,a"))return;
    move(e.clientX,e.clientY);
    const rect=scene.getBoundingClientRect();
    bursts.push({x:e.clientX,y:e.clientY,r:3,speed:3,life:.8});
    bolts.push({pts:makeBolt(e.clientX,e.clientY,65,35,5),life:.7,branch:false});
  },{passive:true});

  enter.addEventListener("click",cross);
  skip.addEventListener("click",cross);

  document.addEventListener("visibilitychange",()=>{
    if(document.hidden){clearTimeout(boltTimer);cancelAnimationFrame(frame);frame=0;}
    else if(!crossed){start();scheduleStrike();}
  });

  addEventListener("resize",resize,{passive:true});
  resize();start();
  if(!reduced)setTimeout(strike,1200);
})();
</script>
</body>
</html>
