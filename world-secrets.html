
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#08040f">
  <title>عالم الأسرار | NEYRA</title>

  <style>
    :root {
      --violet: #a855f7;
      --purple: #7629df;
      --pale: #ead8ff;
      --night: #08040f;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--night);
      color: white;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      overflow: hidden;
    }

    button {
      font: inherit;
    }

    .world {
      position: relative;
      isolation: isolate;
      width: 100%;
      height: 100svh;
      min-height: 520px;
      overflow: hidden;
      background: #0a0612;
    }

    /* صورة المدينة الأصلية */
    .city {
      position: absolute;
      inset: -5%;
      z-index: -6;
      background:
        linear-gradient(180deg,
          rgba(8, 3, 17, .28),
          rgba(8, 3, 17, .12) 40%,
          rgba(5, 2, 11, .86)),
        url("neyra_images/secrets-world.jpg")
        center center / cover no-repeat;
      transform: scale(1.08);
      animation: cinematicZoom 22s ease-in-out infinite alternate;
      will-change: transform;
    }

    .vignette {
      position: absolute;
      inset: 0;
      z-index: -4;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 48%,
          transparent 8%, rgba(8, 3, 15, .12) 48%,
          rgba(3, 1, 8, .88) 100%),
        linear-gradient(0deg,
          rgba(7, 2, 13, .75), transparent 35%,
          rgba(7, 2, 13, .32));
    }

    /* الضباب المتحرك */
    .fog {
      position: absolute;
      z-index: -2;
      pointer-events: none;
      inset: -30%;
      opacity: .52;
      filter: blur(28px);
      background:
        radial-gradient(ellipse at 20% 55%,
          rgba(100, 30, 180, .48), transparent 38%),
        radial-gradient(ellipse at 75% 62%,
          rgba(133, 36, 190, .38), transparent 34%),
        radial-gradient(ellipse at 50% 85%,
          rgba(57, 20, 109, .6), transparent 38%);
      animation: fogDrift 18s ease-in-out infinite alternate;
      will-change: transform;
    }

    .fog.second {
      opacity: .27;
      filter: blur(42px);
      animation-duration: 27s;
      animation-direction: alternate-reverse;
    }

    /* ومضات البرق */
    .lightning {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      opacity: 0;
      background:
        radial-gradient(ellipse at 52% 20%,
          rgba(233, 203, 255, .92),
          rgba(157, 70, 255, .32) 20%,
          transparent 66%);
      mix-blend-mode: screen;
    }

    .lightning.flash {
      animation: lightningFlash .7s ease-out;
    }

    /* طاقة البوابة */
    .portal-area {
      position: absolute;
      z-index: 2;
      width: min(76vw, 440px);
      aspect-ratio: 1;
      top: 47%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: grid;
      place-items: center;
      perspective: 900px;
      transition: transform 1.4s cubic-bezier(.2,.7,.1,1),
                  filter 1s ease;
    }

    .portal-glow {
      position: absolute;
      width: 82%;
      height: 82%;
      border-radius: 50%;
      background: #8b20ff;
      filter: blur(48px);
      opacity: .19;
      animation: glowPulse 3s ease-in-out infinite;
    }

    .portal-ring {
      position: absolute;
      width: 75%;
      height: 92%;
      border: 2px solid rgba(199, 134, 255, .85);
      border-radius: 50%;
      box-shadow:
        0 0 12px #a855f7,
        0 0 35px rgba(168, 85, 247, .85),
        inset 0 0 25px rgba(168, 85, 247, .48);
      transform: rotate(-18deg);
      animation: ringSpin 12s linear infinite;
    }

    .portal-ring.ring-two {
      width: 91%;
      height: 72%;
      border-color: rgba(130, 48, 237, .9);
      transform: rotate(50deg);
      animation: ringSpinTwo 9s linear infinite;
    }

    .portal-ring.ring-three {
      width: 63%;
      height: 86%;
      border-style: dashed;
      border-width: 1px;
      opacity: .8;
      animation: ringSpin 22s linear infinite reverse;
    }

    .portal-core {
      position: relative;
      width: 49%;
      height: 66%;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid rgba(231, 202, 255, .95);
      background:
        radial-gradient(ellipse at 50% 45%,
          rgba(228, 190, 255, .75),
          rgba(122, 36, 222, .72) 27%,
          rgba(22, 5, 42, .95) 68%,
          #07020e 100%);
      box-shadow:
        0 0 20px rgba(196, 124, 255, .9),
        0 0 65px rgba(142, 42, 255, .75),
        inset 0 0 32px rgba(198, 122, 255, .8);
      animation: corePulse 3s ease-in-out infinite;
    }

    .portal-core::before,
    .portal-core::after {
      content: "";
      position: absolute;
      inset: -30%;
      border-radius: 45%;
      background: conic-gradient(
        transparent,
        rgba(226, 181, 255, .9),
        transparent 22%,
        rgba(133, 45, 255, .9),
        transparent 55%,
        rgba(219, 180, 255, .8),
        transparent 82%);
      animation: coreSpin 5s linear infinite;
      mix-blend-mode: screen;
    }

    .portal-core::after {
      inset: 8%;
      opacity: .7;
      animation-duration: 8s;
      animation-direction: reverse;
    }

    .rune {
      position: absolute;
      color: #e4c4ff;
      font-size: clamp(17px, 4vw, 25px);
      text-shadow: 0 0 10px #a855f7, 0 0 25px #8b20ff;
      animation: runeFloat 3s ease-in-out infinite alternate;
    }

    .rune.r1 { top: 1%; left: 45%; }
    .rune.r2 { right: 2%; top: 32%; animation-delay: -.8s; }
    .rune.r3 { bottom: 2%; left: 27%; animation-delay: -1.3s; }
    .rune.r4 { left: 1%; top: 47%; animation-delay: -.4s; }
    .rune.r5 { right: 19%; bottom: 8%; animation-delay: -1.7s; }

    /* طبقة الجزيئات */
    #particles {
      position: absolute;
      inset: 0;
      z-index: 4;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* رأس الصفحة */
    .topbar {
      position: absolute;
      z-index: 8;
      top: max(20px, env(safe-area-inset-top));
      left: 0;
      right: 0;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 4px;
      color: #f0dfff;
      text-shadow: 0 0 18px #a855f7;
    }

    .world-tag {
      font-size: 10px;
      letter-spacing: 2px;
      color: #d0b1ed;
      direction: ltr;
    }

    /* النص الرئيسي */
    .intro-content {
      position: absolute;
      z-index: 6;
      left: 0;
      right: 0;
      bottom: max(38px, env(safe-area-inset-bottom));
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: opacity 1s ease, transform 1s ease;
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 3px;
      color: #d9b9ff;
      margin-bottom: 12px;
      text-shadow: 0 0 15px #a855f7;
      opacity: 0;
      animation: reveal .9s ease 1s forwards;
    }

    h1 {
      font-size: clamp(36px, 9vw, 62px);
      line-height: 1.25;
      margin: 0;
      font-weight: 900;
      color: #fff8ff;
      text-shadow:
        0 0 10px rgba(220, 180, 255, .85),
        0 0 32px rgba(168, 85, 247, .85),
        0 4px 22px #08020e;
      opacity: 0;
      animation: titleReveal 1.2s cubic-bezier(.2,.8,.2,1) 1.4s forwards;
    }

    .subtitle {
      max-width: 350px;
      margin: 12px 0 22px;
      font-size: 13px;
      line-height: 1.9;
      color: #e2d4ef;
      opacity: 0;
      animation: reveal 1s ease 2s forwards;
    }

    .enter-button {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      min-width: 205px;
      min-height: 53px;
      padding: 14px 27px;
      border: 1px solid rgba(226, 190, 255, .85);
      border-radius: 999px;
      color: white;
      background: linear-gradient(110deg, #40116e, #8738d6, #45106e);
      background-size: 200% 100%;
      box-shadow:
        0 0 18px rgba(168, 85, 247, .65),
        inset 0 0 15px rgba(255,255,255,.12);
      cursor: pointer;
      font-weight: bold;
      opacity: 0;
      animation: reveal 1s ease 2.4s forwards,
                 buttonGlow 3s ease-in-out 3.4s infinite;
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .enter-button::before {
      content: "";
      position: absolute;
      z-index: -1;
      top: -60%;
      bottom: -60%;
      left: -70%;
      width: 45%;
      transform: rotate(24deg);
      background: rgba(255,255,255,.28);
      filter: blur(8px);
      animation: buttonShine 4s ease-in-out 4s infinite;
    }

    .enter-button:active {
      transform: scale(.95);
    }

    .skip-button {
      margin-top: 13px;
      border: 0;
      padding: 8px 12px;
      color: rgba(235, 218, 255, .7);
      background: transparent;
      font-size: 11px;
      cursor: pointer;
    }

    .bottom-label {
      position: absolute;
      z-index: 6;
      bottom: max(18px, env(safe-area-inset-bottom));
      left: 18px;
      color: rgba(227, 204, 248, .55);
      font-size: 9px;
      letter-spacing: 2px;
      direction: ltr;
      pointer-events: none;
    }

    /* لحظة العبور */
    .world.crossing .portal-area {
      transform: translate(-50%, -50%) scale(7);
      filter: brightness(3);
    }

    .world.crossing .intro-content,
    .world.crossing .topbar,
    .world.crossing .bottom-label {
      opacity: 0;
      transform: translateY(25px);
      pointer-events: none;
    }

    .world.crossing .city {
      animation: none;
      transform: scale(1.3);
      filter: brightness(1.8) saturate(1.6);
      transition: transform 2s ease, filter 1s ease;
    }

    .world.crossing .fog {
      opacity: 1;
      filter: blur(12px);
    }

    .arrival {
      position: absolute;
      z-index: 12;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 25px;
      text-align: center;
      background: rgba(8, 3, 16, .94);
      opacity: 0;
      visibility: hidden;
      transition: opacity 1.2s ease;
    }

    .arrival.visible {
      opacity: 1;
      visibility: visible;
    }

    .arrival-symbol {
      font-size: 48px;
      color: #d6aaff;
      text-shadow: 0 0 35px #a855f7;
      animation: runeFloat 2s ease-in-out infinite alternate;
    }

    .arrival h2 {
      font-size: 30px;
      margin: 18px 0 8px;
      color: #f2e5ff;
    }

    .arrival p {
      color: #cbb6df;
      line-height: 1.9;
      font-size: 14px;
      max-width: 330px;
    }

    .arrival a {
      margin-top: 20px;
      padding: 12px 23px;
      color: white;
      text-decoration: none;
      border: 1px solid #a855f7;
      border-radius: 999px;
      background: #38145b;
      box-shadow: 0 0 20px rgba(168,85,247,.3);
    }

    /* الحركات */
    @keyframes cinematicZoom {
      from { transform: scale(1.06) translate3d(0,0,0); }
      to { transform: scale(1.19) translate3d(-1%, -1%, 0); }
    }

    @keyframes fogDrift {
      from { transform: translate3d(-5%, 2%, 0) rotate(-4deg) scale(1); }
      to { transform: translate3d(6%, -4%, 0) rotate(5deg) scale(1.08); }
    }

    @keyframes lightningFlash {
      0%, 100% { opacity: 0; }
      12% { opacity: .95; }
      23% { opacity: .12; }
      34% { opacity: .75; }
      48% { opacity: 0; }
    }

    @keyframes glowPulse {
      0%, 100% { opacity: .16; transform: scale(.88); }
      50% { opacity: .45; transform: scale(1.12); }
    }

    @keyframes ringSpin {
      from { rotate: 0deg; }
      to { rotate: 360deg; }
    }

    @keyframes ringSpinTwo {
      from { rotate: 360deg; }
      to { rotate: 0deg; }
    }

    @keyframes coreSpin {
      to { rotate: 360deg; }
    }

    @keyframes corePulse {
      0%, 100% { filter: brightness(.9); }
      50% { filter: brightness(1.45); }
    }

    @keyframes runeFloat {
      from { transform: translateY(0) rotate(-8deg); }
      to { transform: translateY(-9px) rotate(8deg); }
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes titleReveal {
      from { opacity: 0; transform: translateY(28px) scale(.92); filter: blur(8px); }
      to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    @keyframes buttonGlow {
      0%, 100% { box-shadow: 0 0 15px rgba(168,85,247,.4); }
      50% { box-shadow: 0 0 32px rgba(168,85,247,.85), 0 0 60px rgba(100,30,180,.35); }
    }

    @keyframes buttonShine {
      0%, 65% { left: -70%; }
      90%, 100% { left: 140%; }
    }

    @media (max-width: 600px) {
      .portal-area {
        top: 41%;
        width: min(86vw, 390px);
      }

      .intro-content {
        bottom: max(32px, env(safe-area-inset-bottom));
      }

      .subtitle {
        max-width: 300px;
        margin: 9px 0 17px;
      }

      .topbar {
        padding-inline: 17px;
      }

      .fog {
        filter: blur(20px);
      }

      .fog.second {
        filter: blur(28px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <main class="world" id="world">
    <div class="city"></div>
    <div class="fog"></div>
    <div class="fog second"></div>
    <div class="vignette"></div>
    <div class="lightning" id="lightning"></div>
    <canvas id="particles" aria-hidden="true"></canvas>

    <header class="topbar">
      <div class="brand">NEYRA</div>
      <div class="world-tag">WORLD 01 · SECRETS</div>
    </header>

    <div class="portal-area" id="portal" aria-hidden="true">
      <div class="portal-glow"></div>
      <div class="portal-ring"></div>
      <div class="portal-ring ring-two"></div>
      <div class="portal-ring ring-three"></div>
      <div class="portal-core"></div>
      <span class="rune r1">✧</span>
      <span class="rune r2">ᛟ</span>
      <span class="rune r3">✦</span>
      <span class="rune r4">ᚷ</span>
      <span class="rune r5">◇</span>
    </div>

    <section class="intro-content" id="intro">
      <div class="eyebrow">BEYOND THE SILENCE</div>
      <h1>عالم الأسرار</h1>
      <p class="subtitle">
        خلف هذا الضباب، تختبئ حكايات لم تُروَ بعد.
        اقترب... واكتشف ما وراء الصمت.
      </p>
      <button class="enter-button" id="enterButton">
        ✦ ادخل عالم الأسرار
      </button>
      <button class="skip-button" id="skipButton">
        تخطي المقدمة
      </button>
    </section>

    <div class="bottom-label">A NEYRA EXPERIENCE</div>

    <section class="arrival" id="arrival" aria-live="polite">
      <div class="arrival-symbol">✧</div>
      <h2>لقد عبرت البوابة</h2>
      <p>
        استعد لاكتشاف ما وراء الضباب.
        العالم الداخلي سنربطه في المرحلة التالية.
      </p>
      <a href="index.html">العودة إلى NEYRA</a>
    </section>
  </main>

  <script>
    (() => {
      const world = document.getElementById("world");
      const portal = document.getElementById("portal");
      const lightning = document.getElementById("lightning");
      const enterButton = document.getElementById("enterButton");
      const skipButton = document.getElementById("skipButton");
      const arrival = document.getElementById("arrival");
      const canvas = document.getElementById("particles");
      const ctx = canvas.getContext("2d");

      if (!ctx) return;

      let width = 0;
      let height = 0;
      let particles = [];
      let animationFrame = 0;
      let lastFrame = 0;
      let crossed = false;

      const reduceMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      ).matches;

      const isMobile = window.matchMedia("(max-width: 600px)").matches;
      const particleCount = reduceMotion ? 0 : (isMobile ? 42 : 85);

      function resizeCanvas() {
        const ratio = Math.min(window.devicePixelRatio || 1, 1.5);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.round(width * ratio);
        canvas.height = Math.round(height * ratio);
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      }

      function createParticle(fromBottom = false) {
        return {
          x: Math.random() * width,
          y: fromBottom ? height + Math.random() * 60 : Math.random() * height,
          r: Math.random() * 2.1 + .45,
          speed: Math.random() * .55 + .18,
          drift: (Math.random() - .5) * .65,
          alpha: Math.random() * .65 + .2,
          phase: Math.random() * Math.PI * 2
        };
      }

      function initializeParticles() {
        particles = Array.from(
          { length: particleCount },
          () => createParticle()
        );
      }

      function drawParticles(time) {
        if (document.hidden || crossed) {
          animationFrame = 0;
          return;
        }

        if (time - lastFrame < 30) {
          animationFrame = requestAnimationFrame(drawParticles);
          return;
        }

        lastFrame = time;
        ctx.clearRect(0, 0, width, height);

        for (const p of particles) {
          p.y -= p.speed;
          p.x += p.drift + Math.sin(time * .0007 + p.phase) * .25;

          if (p.y < -10) Object.assign(p, createParticle(true));
          if (p.x < -10) p.x = width + 10;
          if (p.x > width + 10) p.x = -10;

          const shimmer = .65 + Math.sin(time * .002 + p.phase) * .35;
          ctx.beginPath();
          ctx.fillStyle = `rgba(207, 151, 255, ${p.alpha * shimmer})`;
          ctx.shadowBlur = 12;
          ctx.shadowColor = "#a855f7";
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.shadowBlur = 0;
        animationFrame = requestAnimationFrame(drawParticles);
      }

      function startParticles() {
        if (!animationFrame && !document.hidden && !crossed) {
          animationFrame = requestAnimationFrame(drawParticles);
        }
      }

      function flashLightning() {
        if (crossed || document.hidden || reduceMotion) return;

        lightning.classList.remove("flash");
        void lightning.offsetWidth;
        lightning.classList.add("flash");

        if (Math.random() > .55) {
          setTimeout(() => {
            if (crossed || document.hidden) return;
            lightning.classList.remove("flash");
            void lightning.offsetWidth;
            lightning.classList.add("flash");
          }, 160);
        }

        scheduleLightning();
      }

      let lightningTimer;

      function scheduleLightning() {
        clearTimeout(lightningTimer);
        lightningTimer = setTimeout(
          flashLightning,
          3500 + Math.random() * 6500
        );
      }

      function crossPortal() {
        if (crossed) return;
        crossed = true;

        clearTimeout(lightningTimer);
        cancelAnimationFrame(animationFrame);
        animationFrame = 0;

        enterButton.disabled = true;
        skipButton.disabled = true;
        world.classList.add("crossing");

        lightning.classList.remove("flash");
        void lightning.offsetWidth;
        lightning.classList.add("flash");

        setTimeout(() => {
          arrival.classList.add("visible");
        }, 1800);
      }

      // حركة خفيفة مع اللمس أو الماوس
      function movePortal(clientX, clientY) {
        if (crossed || reduceMotion) return;

        const x = (clientX / width - .5) * 7;
