
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080810">
  <title>إنشاء حساب | NEYRA</title>

  <style>
    :root {
      --bg: #080810;
      --panel: rgba(20, 20, 38, .88);
      --purple: #a578ff;
      --cyan: #72e7f4;
      --text: #f6f3ff;
      --muted: #a6a3bc;
      --border: rgba(165, 120, 255, .24);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse at 15% 15%, #42207855, transparent 42%),
        radial-gradient(ellipse at 85% 85%, #087c8c30, transparent 40%),
        var(--bg);
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 30px 24px;
      border: 1px solid var(--border);
      border-radius: 26px;
      background: var(--panel);
      box-shadow: 0 20px 70px #0007, 0 0 40px #8b5cf611;
      backdrop-filter: blur(18px);
    }

    .logo {
      text-align: center;
      margin-bottom: 26px;
    }

    .symbol {
      width: 58px;
      height: 58px;
      margin: 0 auto 12px;
      display: grid;
      place-items: center;
      border: 1px solid #a578ff77;
      border-radius: 19px;
      color: var(--cyan);
      font-size: 29px;
      box-shadow: 0 0 30px #8b5cf633;
    }

    .brand {
      margin: 0;
      font-size: 29px;
      letter-spacing: 5px;
      background: linear-gradient(90deg, var(--cyan), var(--purple));
      color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-top: 8px;
    }

    h2 {
      font-size: 23px;
      margin: 0 0 8px;
    }

    .intro {
      margin: 0 0 23px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
    }

    .field { margin-bottom: 16px; }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      color: #e4dfff;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      border-radius: 13px;
      border: 1px solid #ffffff1c;
      outline: none;
      background: #090914;
      color: white;
      font: inherit;
      font-size: 14px;
      transition: .2s;
    }

    input:focus {
      border-color: var(--purple);
      box-shadow: 0 0 0 3px #a578ff18;
    }

    input::placeholder { color: #77748d; }

    .hint {
      margin: 7px 2px 0;
      color: var(--muted);
      font-size: 11px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 13px;
      padding: 14px;
      margin-top: 8px;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      transition: transform .2s, opacity .2s;
    }

    button:active { transform: scale(.98); }
    button:disabled { opacity: .55; cursor: wait; }

    .primary {
      color: #100b20;
      background: linear-gradient(100deg, var(--purple), var(--cyan));
      box-shadow: 0 7px 25px #8b5cf629;
    }

    .google {
      color: var(--text);
      background: #ffffff08;
      border: 1px solid var(--border);
      margin-top: 12px;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
      margin: 20px 0 10px;
    }

    .divider::before, .divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: #ffffff19;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    .message.error {
      display: block;
      color: #ffb4c0;
      background: #ff365f12;
      border: 1px solid #ff365f40;
    }

    .message.success {
      display: block;
      color: #9cf5d4;
      background: #36d99a12;
      border: 1px solid #36d99a40;
    }

    .bottom {
      margin-top: 22px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }

    a {
      color: var(--cyan);
      text-decoration: none;
    }

    a:hover { text-decoration: underline; }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: var(--muted);
    }

    @media (max-width: 380px) {
      .card { padding: 25px 18px; }
      .brand { font-size: 25px; }
    }
  </style>
</head>

<body>
  <main class="card">
    <header class="logo">
      <div class="symbol" aria-hidden="true">✧</div>
      <h1 class="brand">NEYRA</h1>
      <div class="subtitle">مساحتك الخاصة في عوالم نيرا</div>
    </header>

    <h2>أنشئ شخصيتك ✨</h2>
    <p class="intro">
      ابدأ رحلتك، اختار اسمك المستعار، وادخل عالم نيرا.
    </p>

    <form id="registerForm">
      <div class="field">
        <label for="username">الاسم المستعار</label>
        <input
          id="username"
          name="username"
          type="text"
          minlength="3"
          maxlength="24"
          pattern="[A-Za-z0-9_]+"
          placeholder="مثال: Neyra_User"
          autocomplete="username"
          required
        >
        <p class="hint">استخدم حروف إنجليزية وأرقامًا أو _ فقط.</p>
      </div>

      <div class="field">
        <label for="fullName">الاسم الظاهر (اختياري)</label>
        <input
          id="fullName"
          name="fullName"
          type="text"
          maxlength="60"
          placeholder="الاسم اللي تحب الناس تشوفه"
          autocomplete="nickname"
        >
      </div>

      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input
          id="email"
          name="email"
          type="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >
      </div>

      <div class="field">
        <label for="password">كلمة المرور</label>
        <input
          id="password"
          name="password"
          type="password"
          minlength="8"
          placeholder="8 أحرف على الأقل"
          autocomplete="new-password"
          required
        >
      </div>

      <div class="field">
        <label for="confirmPassword">تأكيد كلمة المرور</label>
        <input
          id="confirmPassword"
          name="confirmPassword"
          type="password"
          minlength="8"
          placeholder="اكتب كلمة المرور مرة أخرى"
          autocomplete="new-password"
          required
        >
      </div>

      <button class="primary" id="registerButton" type="submit">
        إنشاء حساب جديد
      </button>

      <div class="divider">أو</div>

      <button class="google" id="googleButton" type="button">
        ◉ المتابعة باستخدام Google
      </button>

      <div id="message" class="message" role="status" aria-live="polite"></div>
    </form>

    <div class="bottom">
      عندك حساب بالفعل؟
      <a href="login.html">سجّل الدخول</a>
    </div>

    <a class="back" href="index.html">← العودة إلى الصفحة الرئيسية</a>
  </main>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    // ضع بيانات مشروع NEYRA هنا قبل اختبار التسجيل.
    const SUPABASE_URL = "https://aboenvwqlzmbjyqisarb.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_-U554BTwIf6tP-DA9uRgCg_5w5_XtU3";

    const form = document.getElementById("registerForm");
    const registerButton = document.getElementById("registerButton");
    const googleButton = document.getElementById("googleButton");
    const message = document.getElementById("message");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    function setLoading(loading) {
      registerButton.disabled = loading;
      googleButton.disabled = loading;
      registerButton.textContent = loading
        ? "جاري التنفيذ..."
        : "إنشاء حساب جديد";
    }

    let supabase;

    try {
      if (
        SUPABASE_URL.startsWith("https://") &&
        !SUPABASE_URL.includes("YOUR_") &&
        SUPABASE_ANON_KEY &&
        !SUPABASE_ANON_KEY.includes("YOUR_")
      ) {
        supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch (error) {
      console.error("Supabase setup error:", error);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!supabase) {
        showMessage(
          "لسه محتاجين نحط رابط مشروع Supabase والمفتاح العام قبل التسجيل.",
          "error"
        );
        return;
      }

      const username = document.getElementById("username").value.trim();
      const fullName = document.getElementById("fullName").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        showMessage("كلمتا المرور غير متطابقتين.", "error");
        return;
      }

      setLoading(true);

      try {
        const { data, error } = await supabase.auth.signUp({
          email,
          password,
          options: {
            data: {
              username,
              full_name: fullName || username
            }
          }
        });

        if (error) throw error;

        // If email confirmation is disabled, a session may be returned.
        // The profile is saved after successful account creation.
        if (data.user && data.session) {
          const { error: profileError } = await supabase
            .from("profiles")
            .upsert({
              id: data.user.id,
              username,
              full_name: fullName || username
            });

          if (profileError) throw profileError;

          showMessage("تم إنشاء الحساب! جاري نقلك إلى الصفحة الرئيسية.", "success");
          window.location.href = "index.html";
          return;
        }

        showMessage(
          "تم إرسال طلب إنشاء الحساب. راجع بريدك الإلكتروني لتأكيد الحساب، وبعدها سجّل الدخول.",
          "success"
        );
        form.reset();
      } catch (error) {
        console.error(error);
        showMessage(
          error.message || "حصل خطأ أثناء إنشاء الحساب. حاول مرة أخرى.",
          "error"
        );
      } finally {
        setLoading(false);
      }
    });

    googleButton.addEventListener("click", async () => {
      if (!supabase) {
        showMessage(
          "لسه محتاجين نحط رابط المشروع والمفتاح العام الأول.",
          "error"
        );
        return;
      }

      try {
        googleButton.disabled = true;

        const { error } = await supabase.auth.signInWithOAuth({
          provider: "google",
          options: {
            redirectTo: window.location.origin + "/index.html"
          }
        });

        if (error) throw error;
      } catch (error) {
        console.error(error);
        showMessage(
          error.message || "تعذّر تسجيل الدخول باستخدام Google.",
          "error"
        );
        googleButton.disabled = false;
      }
    });
  </script>
</body>
</html>
