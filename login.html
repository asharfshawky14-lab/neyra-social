
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | NEYRA</title>
  <meta name="theme-color" content="#090914">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #f7f5ff;
      background:
        radial-gradient(ellipse at top, #292052 0%, #101020 45%, #080810 100%);
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 30px 24px;
      border: 1px solid #393052;
      border-radius: 22px;
      background: rgba(15, 15, 31, .96);
      box-shadow: 0 20px 70px #0008;
    }
    .logo {
      text-align: center;
      font-size: 35px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #bba4ff;
      margin-bottom: 8px;
    }
    h1 { text-align: center; font-size: 23px; margin: 8px 0; }
    .subtitle {
      text-align: center;
      color: #aaa5c1;
      font-size: 14px;
      margin-bottom: 25px;
    }
    label { display: block; margin: 15px 0 8px; font-size: 14px; }
    input {
      width: 100%;
      padding: 14px;
      color: white;
      background: #0b0b18;
      border: 1px solid #39334f;
      border-radius: 11px;
      outline: none;
      font-size: 15px;
    }
    input:focus { border-color: #a78bfa; }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 17px;
      border: 0;
      border-radius: 11px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    .primary {
      color: #100c20;
      background: linear-gradient(100deg, #c4b5fd, #67e8f9);
    }
    .google {
      color: white;
      background: #242237;
      border: 1px solid #49425e;
    }
    .links { text-align: center; margin-top: 22px; line-height: 2.2; }
    a { color: #bba4ff; text-decoration: none; }
    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #252139;
      color: #e8e1ff;
      font-size: 14px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }
    button:disabled { opacity: .6; cursor: wait; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">NEYRA</div>
    <h1>أهلاً بعودتك</h1>
    <p class="subtitle">سجّل دخولك وارجع لمجتمعك</p>

    <form id="loginForm">
      <label for="email">البريد الإلكتروني</label>
      <input id="email" type="email" autocomplete="email"
             placeholder="name@example.com" required>

      <label for="password">كلمة المرور</label>
      <input id="password" type="password"
             autocomplete="current-password"
             placeholder="اكتب كلمة المرور" required>

      <button class="primary" id="loginBtn" type="submit">تسجيل الدخول</button>
    </form>

    <button class="google" id="googleBtn" type="button">
      المتابعة باستخدام Google
    </button>

    <div class="message" id="message" role="status"></div>

    <div class="links">
      <div><a href="reset-password.html">نسيت كلمة المرور؟</a></div>
      <div>لسه معندكش حساب؟ <a href="register.html">إنشاء حساب جديد</a></div>
      <div><a href="index.html">العودة إلى NEYRA</a></div>
    </div>
  </main>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://aboenvwqlzmbjyqisarb.supabase.co";
    const SUPABASE_KEY = "sb_publishable_-U554BTwIf6tP-DA9uRgCg_5w5_XtU3";

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
    const homeUrl = new URL("index.html", window.location.href).href;

    const message = document.getElementById("message");
    const loginBtn = document.getElementById("loginBtn");
    const googleBtn = document.getElementById("googleBtn");

    function showMessage(text) {
      message.textContent = text;
      message.style.display = "block";
    }

    document.getElementById("loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      loginBtn.disabled = true;
      loginBtn.textContent = "جارٍ تسجيل الدخول...";
      message.style.display = "none";

      try {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const { error } = await supabase.auth.signInWithPassword({
          email,
          password
        });

        if (error) throw error;
        window.location.replace(homeUrl);
      } catch (error) {
        showMessage(error.message || "تعذر تسجيل الدخول. حاول مرة أخرى.");
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = "تسجيل الدخول";
      }
    });

    googleBtn.addEventListener("click", async () => {
      googleBtn.disabled = true;
      googleBtn.textContent = "جارٍ فتح Google...";
      message.style.display = "none";

      try {
        const { error } = await supabase.auth.signInWithOAuth({
          provider: "google",
          options: { redirectTo: homeUrl }
        });

        if (error) throw error;
      } catch (error) {
        showMessage(error.message || "تعذر بدء تسجيل الدخول باستخدام Google.");
        googleBtn.disabled = false;
        googleBtn.textContent = "المتابعة باستخدام Google";
      }
    });

    const { data } = await supabase.auth.getSession();
    if (data.session) {
      window.location.replace(homeUrl);
    }
  </script>
</body>
</html>
